# k8s/argocd/prometheus-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 56.21.4
      helm:
        valueFiles:
          - $my-repo/k8s/values/prometheus-values.yaml
        parameters:
        
    - repoURL: https://github.com/daviancold/PortfolioWebsite2.git
      targetRevision: HEAD
      ref: my-repo
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true