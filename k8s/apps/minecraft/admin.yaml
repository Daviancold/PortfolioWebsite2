apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-admin
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-admin
  template:
    metadata:
      labels:
        app: minecraft-admin
    spec:
      nodeSelector:
        node-role.kubernetes.io/apps: "true"
      containers:
      - name: terminal
        image: alpine
        command: ["/bin/sh", "-c", "apk add --no-cache bash nano vim tar; sleep infinity"]
        volumeMounts:
        - name: minecraft-storage
          mountPath: /data
      volumes:
      - name: minecraft-storage
        persistentVolumeClaim:
          claimName: minecraft-storage